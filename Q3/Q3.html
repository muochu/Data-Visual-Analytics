<!DOCTYPE html>
<!-- cse6242 -->

<!-- run: http-server & -->

<head>
  <style>    
    /* Define css rules here */
  </style>
<title>Wildlife Trafficking Incidents per Species (2015 to 2023)</title>
</head>

<body>

  <script src="lib/d3/d3.min.js"></script>
  <script src="lib/d3-dsv/d3-dsv.min.js"></script>
  <script src="lib/d3-fetch/d3-fetch.min.js"></script>


  <script>
    // define the dimensions and margins for the graph
    var margin = {top: 50, right: 50, bottom: 60, left: 150};
    var width = 900 - margin.left - margin.right;
    var height = 370 - margin.top - margin.bottom;


    // create scales x & y for X and Y axis and set their ranges
    var x = d3.scaleLinear().range([0, width]);
    var y = d3.scaleBand().range([0, height]).padding(0.1);


    // append svg element to the body of the page
    var svg = d3.select("body").append("svg")
	   	// set the id, dimensions and position of the svg element
	    .attr("id", "svg1")
	    .attr("width", 900)
	    .attr("height", 370)
	    .append("g")
	    .attr("id", "container")
	    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");


    // Get the data and filter for top 5 most trafficked species
	  var pathToCsv = "q3.csv";		// path to csv
	
    d3.dsv(",", pathToCsv, function (d) {
      return {
        species: d.species,
        count: +d.count  // convert to number
      }
    }).then(function (data) {
      console.log(data); // you should see the data in your browser's developer tools console 
      
      /* Create bar plot using data from csv */
      
      // Filter for top 5 most trafficked species (sort descending by count, take top 5)
      var top5Data = data.sort(function(a, b) { return b.count - a.count; }).slice(0, 5);

      // set the domains of X and Y scales based on data
      x.domain([0, d3.max(top5Data, function(d) { return d.count; })]);
      y.domain(top5Data.map(function(d) { return d.species; }));

      // Add bars to svg - create new elements based on your data
      var barsGroup = svg.append("g").attr("id", "bars");
      
      // Color palette (colorblind-safe)
      var colors = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd"];
      
      var bars = barsGroup.selectAll("rect")
        .data(top5Data)
        .enter()
        .append("rect")
        .attr("x", 0)
        .attr("y", function(d) { return y(d.species); })
        .attr("width", function(d) { return x(d.count); })
        .attr("height", y.bandwidth())
        .attr("fill", function(d, i) { return colors[i]; });


      // Add the X Axis
      var maxCount = d3.max(top5Data, function(d) { return d.count; });
      var tickValues = [];
      for (var i = 0; i <= maxCount; i += 500) {
        tickValues.push(i);
      }
      var xAxis = d3.axisBottom(x)
        .tickValues(tickValues);
      
      svg.append("g")
        .attr("id", "x_axis")
        .attr("transform", "translate(0," + height + ")")
        .call(xAxis);

      // Add the text label for X Axis
      svg.append("text")
        .attr("id", "x_axis_label")
        .attr("x", width / 2)
        .attr("y", height + 50)
        .style("text-anchor", "middle")
        .text("Count");

      // Add the Y Axis
      var yAxis = d3.axisLeft(y);
      
      svg.append("g")
        .attr("id", "y_axis")
        .call(yAxis);

      // Add the text label for Y axis
      svg.append("text")
        .attr("id", "y_axis_label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -120)
        .style("text-anchor", "middle")
        .text("Species");

      // Add GT username
      svg.append("text")
        .attr("id", "credit")
        .attr("x", width)
        .attr("y", height + 50)
        .style("text-anchor", "end")
        .text("mhu323");

      // Add Title
      svg.append("text")
        .attr("id", "title")
        .attr("x", width / 2)
        .attr("y", -20)
        .style("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Wildlife Trafficking Incidents per Species (2015 to 2023)");


    }).catch(function (error) {
      console.log(error);
    });

  </script>
</body>
